services:
  backend:
    image: container-registry.br-se1.magalu.cloud/rizer/backend:latest
    container_name: rizer_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: container-registry.br-se1.magalu.cloud/rizer/motorise:latest
    container_name: rizer_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VITE_API_URL=http://backend:8080
      - VITE_BASE_DOMAIN=motorise.com.br

  postgres:
    image: postgis/postgis:17-3.5
    container_name: rizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rizer_marketplaces
      POSTGRES_USER: rizer
      POSTGRES_PASSWORD: rizer
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - rizer_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizer -d rizer_marketplaces"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: rizer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rizer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rizer_postgres_data:
  rizer_redis_data:
