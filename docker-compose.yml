services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: rizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rizer_marketplaces
      POSTGRES_USER: rizer
      POSTGRES_PASSWORD: rizer
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - rizer_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizer -d rizer_marketplaces"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: rizer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rizer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:2.54
    container_name: rizer_redis_insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy


volumes:
  rizer_postgres_data:
  rizer_redis_data:
