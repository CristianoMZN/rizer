<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <!-- Loading screen - appears immediately to prevent FOUC -->
    <style>
      #app-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 1;
        transition: opacity 0.4s ease-out;
      }

      #app-loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        color: white;
      }

      .loading-text {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin: 0;
        font-family: 'Inter', 'Roboto', sans-serif;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-dots {
        display: flex;
        gap: 8px;
      }

      .loading-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.7);
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loading-dots span:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          opacity: 0.7;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>

    <script>
      // Detecta tema escuro e ajusta o overlay
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches === false) {
        const overlay = document.createElement('style');
        overlay.textContent = '#app-loading-overlay { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }';
        document.head.appendChild(overlay);
      }
    </script>
  </head>
  <body>
    <!-- App loading overlay (appears immediately before Vue hydration) -->
    <div id="app-loading-overlay">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Carregando...</p>
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- quasar:entry-point -->
  </body>
</html>
