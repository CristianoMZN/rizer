spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: core-marketplace
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  ai:
    vectorstore:
      redis:
        index: ${SPRING_AI_VECTORSTORE_REDIS_INDEX}
        prefix: ${SPRING_AI_VECTORSTORE_REDIS_PREFIX}
        initialize-schema: ${SPRING_AI_VECTORSTORE_REDIS_INITIALIZE_SCHEMA}
springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    enabled: false

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:30}
    issuer: ${APP_JWT_ISSUER:motorise}
  oauth2:
    success-redirect: ${APP_OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/auth/callback}
  s3:
    region: ${APP_S3_REGION}
    endpoint: ${APP_S3_ENDPOINT:}
    path-style-access: ${APP_S3_PATH_STYLE:false}
    public:
      bucket: ${APP_S3_PUBLIC_BUCKET}
      key-prefix: ${APP_S3_PUBLIC_KEY_PREFIX:uploads}
    private:
      bucket: ${APP_S3_PRIVATE_BUCKET}
      key-prefix: ${APP_S3_PRIVATE_KEY_PREFIX:docs}
      presigned-duration-minutes: ${APP_S3_PRESIGNED_DURATION_MINUTES:15}
