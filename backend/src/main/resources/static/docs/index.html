<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizer Marketplace API Docs</title>
    <style>
      :root {
        --page-bg: radial-gradient(circle at 18% 8%, #1a2463 0%, #0e1541 38%, #090f2e 68%, #070b22 100%);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--page-bg);
        overflow-x: hidden;
      }

      #app {
        position: relative;
        z-index: 1;
        min-height: 100%;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -25vh -18vw;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(80% 58% at 20% 16%, rgba(83, 248, 255, 0.5), rgba(83, 248, 255, 0) 62%),
          radial-gradient(72% 54% at 84% 30%, rgba(172, 94, 255, 0.46), rgba(172, 94, 255, 0) 64%),
          radial-gradient(88% 62% at 58% 88%, rgba(111, 120, 255, 0.38), rgba(111, 120, 255, 0) 66%);
        filter: blur(46px) saturate(135%);
        opacity: 0.9;
      }

      body::after {
        content: "";
        position: fixed;
        inset: -10vh -20vw;
        z-index: 0;
        pointer-events: none;
        background:
          linear-gradient(
            114deg,
            rgba(0, 0, 0, 0) 18%,
            rgba(58, 230, 255, 0.1) 28%,
            rgba(106, 91, 255, 0.35) 36%,
            rgba(214, 96, 255, 0.42) 44%,
            rgba(112, 214, 255, 0.32) 52%,
            rgba(0, 0, 0, 0) 62%
          ),
          linear-gradient(
            114deg,
            rgba(0, 0, 0, 0) 36%,
            rgba(77, 97, 255, 0.22) 44%,
            rgba(190, 97, 255, 0.34) 50%,
            rgba(109, 233, 255, 0.24) 56%,
            rgba(0, 0, 0, 0) 66%
          );
        background-size: 170% 58%, 178% 54%;
        background-position: -18% 14%, 32% 66%;
        background-repeat: no-repeat;
        filter: blur(18px) saturate(135%);
        transform: rotate(-8deg) scale(1.12);
        transform-origin: center;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi',
        layout: 'modern',
        theme: 'purple',
        forceDarkModeState: 'dark',
        searchHotKey: 'k',
        showSidebar: true,
        persistAuth: true,
        customCss: `
          .light-mode,
          .dark-mode {
            --scalar-background-1: #0c0b14;
            --scalar-background-2: #141026;
            --scalar-background-3: #1e1538;
            --scalar-background-accent: #6f46e7;
            --scalar-color-1: #f6f2ff;
            --scalar-color-2: #cabcf0;
            --scalar-color-3: #9f8ed7;
            --scalar-color-accent: #a36bff;
            --scalar-border-color: #34265f;
            --scalar-sidebar-background-1: linear-gradient(180deg, #160f2f 0%, #0f0c20 100%);
            --scalar-sidebar-item-hover-background: #2d1e52;
            --scalar-sidebar-color-1: #f6f2ff;
            --scalar-code-background: #120f24;
            --scalar-code-color: #efe6ff;
          }

          .scalar-app {
              background: transparent;
          }

          .sidebar {
            backdrop-filter: blur(8px);
          }

          .introduction-card,
          .section-card {
            border-radius: 14px;
            border: 1px solid rgba(163, 107, 255, 0.35);
            box-shadow: 0 12px 36px rgba(103, 57, 201, 0.18);
          }

          .operation-details {
            border-radius: 12px;
          }

          .scalar-app .button:hover {
            filter: brightness(1.08);
          }
        `,
      });
    </script>
  </body>
</html>
